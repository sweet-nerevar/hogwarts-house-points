<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hogwarts House Points</title>
<style>
  :root {
    --ink:#eadfca;
    --panel:#f6eddc;
    --panel-border:#b4874e;
    --shadow:rgba(8,10,14,.26);
    --scene-width:1672px;
  }
  * { box-sizing:border-box; }

  html,
  body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
  }

  body {
    padding:0;
    font-family: Georgia, "Times New Roman", serif;
    color:var(--ink);
  }

  .app {
    position:relative;
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
  }

  .scene {
    position:absolute;
    left:50%;
    top:50%;
    width:min(100vw, calc(100vh * 1672 / 941));
    aspect-ratio:1672 / 941;
    transform:translate(-50%, -50%);
  }

  .frame {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    z-index:4;
  }

  /* The whole widget scales as one 1672:941 composition inside the iframe. */
  .scene, .scene * {
    max-width:none;
  }

.slot {
  position:absolute;
  z-index:2;
  pointer-events:none;
}

/* координаты колбочек */
.slot[data-house="gryffindor"] {
  left:10.8%;
  top:32%;
  width:29%;
  height:60.9%;
}

.slot[data-house="slytherin"] {
  left:26.9%;
  top:32%;
  width:29%;
  height:60.9%;
}

.slot[data-house="hufflepuff"] {
  left:44.1%;
  top:32%;
  width:29%;
  height:60.9%;
}

.slot[data-house="ravenclaw"] {
  left:60.2%;
  top:32%;
  width:29%;
  height:60.9%;
}

.vial-wrap {
  position:absolute;
  left:30%;
  top:0;
  width:40%;
  height:73.2%;
}

  .vial {
    --fill: 0%;
    --house: #b51f18;
    --house-top: #d85645;
    position:relative;
    width:100%;
    height:100%;
    border-radius:30px 30px 18px 18px / 18px 18px 16px 16px;
    overflow:hidden;
    background:
      linear-gradient(90deg,
        rgba(0, 0, 0,.40) 0%,
        rgba(0, 0, 0,.12) 10%,
        rgba(0, 0, 128,.10) 22%,
        rgba(255, 255, 255,.15) 48%,
        rgba(184, 134, 11,.05) 70%,
        rgba(47, 79, 79,.26) 100%),
      linear-gradient(180deg, rgba(25, 25, 112,.20), rgba(91,112,125,.06));
    box-shadow:
      inset 0 0 0 2px rgba(239,247,250,.52),
      inset 0 0 24px rgba(185,215,226,.16),
      inset 9px 0 14px rgba(255,255,255,.10),
      inset -9px 0 14px rgba(255,255,255,.04),
      0 8px 18px var(--shadow);
    backdrop-filter: blur(1px);
  }

  .vial::before {
    content:"";
    position:absolute;
    left:16%; right:16%; top:2.7%;
    height:4.8%;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.22));
    opacity:.72;
    filter:blur(.2px);
  }

  .liquid {
    position:absolute;
    left:0; right:0; bottom:0;
    height:var(--fill);
    transition:height .8s cubic-bezier(.2,.78,.22,1);
    background:
      radial-gradient(circle at 25% 30%, rgba(255,255,255,.10) 0 1px, transparent 2px),
      radial-gradient(circle at 65% 18%, rgba(255,255,255,.14) 0 1px, transparent 2px),
      radial-gradient(circle at 52% 68%, rgba(255,255,255,.10) 0 1.5px, transparent 6px),
      linear-gradient(180deg, var(--house-top), var(--house) 65%, color-mix(in srgb, var(--house) 78%, black 22%));
    background-size: 22px 24px, 20px 24px, 26px 22px, 100% 100%;
    box-shadow:
      inset 0 10px 12px rgba(255,255,255,.08),
      inset 0 -16px 18px rgba(0,0,0,.13);
  }

.liquid::before {
  content:"";
  position:absolute;
  left:-2%;
  right:-2%;
  top:-4px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

  .liquid::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(255,255,255,.15), transparent 18%, rgba(255,255,255,.06) 46%, transparent 68%, rgba(255,255,255,.12));
    mix-blend-mode:screen;
  }

.house-plate {
  position:absolute;
  left:9.5%;
  top:74%;
  width:81%;
  height:12%;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0;
  min-height:0;
  pointer-events:auto;
}

.score-view,
.score-input {
  position:static;
  transform:none;

  width:60%;
  text-align:center;
  background:transparent;
  border:none;
  outline:none;

  color:#2F4F4F;
  font-family:Georgia, "Times New Roman", serif;
  font-size:clamp(12px, 1.7vw, 28px);
  line-height:2;

  letter-spacing:.09em;
  text-shadow:0 1px 3px rgba(0,0,0,.65);
  font-variant-numeric:tabular-nums;
}

  .score-input {
    background:rgba(18,17,14,.28);
    border:1px solid rgba(234,211,160,.35);
    border-radius:999px;
    padding:1px 2px;
    box-shadow: inset 0 0 10px rgba(255,255,255,.05);
    appearance:textfield;
    -moz-appearance:textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

  .house-name {
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }


  .score-input {
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease;
  }
  .score-input:focus {
    background:rgba(255,249,238,.72);
    border-color:rgba(180,139,77,.72);
    box-shadow:0 0 0 2px rgba(199,155,87,.14), inset 0 0 8px rgba(255,255,255,.24);
    color:#263c39;
  }
  .score-input.saving {
    border-color:rgba(199,155,87,.8);
    box-shadow:0 0 0 2px rgba(199,155,87,.16), inset 0 0 8px rgba(255,255,255,.16);
  }
  .score-input.saved {
    background:rgba(225,205,151,.44);
    border-color:rgba(199,155,87,.95);
    box-shadow:0 0 12px rgba(199,155,87,.28);
  }
  .score-input.save-error {
    background:rgba(110,30,30,.22);
    border-color:rgba(169,58,52,.75);
    box-shadow:0 0 10px rgba(169,58,52,.18);
  }

  .gryffindor .vial { --house:#af211c; --house-top:#d84b3e; }
  .slytherin .vial  { --house:#219354; --house-top:#4cc07a; }
  .hufflepuff .vial { --house:#c09219; --house-top:#e2bd4c; }
  .ravenclaw .vial  { --house:#2b73be; --house-top:#52a0ea; }

</style>
</head>
<body>
<div class="app" id="board">
  <div class="scene" id="scene">
    <img class="frame" src="" alt="" />
    <div class="slot gryffindor" data-house="gryffindor">
      <span class="house-name">Gryffindor</span>
      <div class="vial-wrap"><div class="vial" style="--fill:0%"><div class="liquid"></div></div></div>
      <div class="house-plate" data-plate="gryffindor"></div>
    </div>
    <div class="slot slytherin" data-house="slytherin">
      <span class="house-name">Slytherin</span>
      <div class="vial-wrap"><div class="vial" style="--fill:0%"><div class="liquid"></div></div></div>
      <div class="house-plate" data-plate="slytherin"></div>
    </div>
    <div class="slot hufflepuff" data-house="hufflepuff">
      <span class="house-name">Hufflepuff</span>
      <div class="vial-wrap"><div class="vial" style="--fill:0%"><div class="liquid"></div></div></div>
      <div class="house-plate" data-plate="hufflepuff"></div>
    </div>
    <div class="slot ravenclaw" data-house="ravenclaw">
      <span class="house-name">Ravenclaw</span>
      <div class="vial-wrap"><div class="vial" style="--fill:0%"><div class="liquid"></div></div></div>
      <div class="house-plate" data-plate="ravenclaw"></div>
    </div>
  </div>

</div>

<script>
const CONFIG = {
  SUPABASE_URL: "https://ktssmsluniqjercbwodg.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_8gIOTlpU6JmPkhVW89yXTQ_vygcKiHL",
  BOARD_ID: "main",
  MAX_SCORE: 300,
  POLL_MS: 3000,
  FRAME_IMAGE: "https://www.dropbox.com/scl/fi/4jb08no2isiiw4f3eb970/a37c8e5a-d4d6-4476-8a81-735ace47d71d.png?rlkey=lj8h6l4z2a4kjp778sblsklxw&st=g32nkyaj&raw=1"
};

const HOUSES = [
  { key:"gryffindor", name:"Gryffindor", start:50 },
  { key:"slytherin",  name:"Slytherin",  start:50 },
  { key:"hufflepuff", name:"Hufflepuff", start:50 },
  { key:"ravenclaw",  name:"Ravenclaw",  start:50 }
];

document.querySelector('.frame').src = CONFIG.FRAME_IMAGE;

const state = Object.fromEntries(HOUSES.map(h => [h.key, h.start]));
const $ = (s, root=document) => root.querySelector(s);
const saveTimers = new Map();

function clamp(n,min,max){ return Math.min(max,Math.max(min,n)); }
function pct(points){ return clamp(points / CONFIG.MAX_SCORE * 100, 0, 100); }

function mountPlates(){
  HOUSES.forEach(h => {
    const plate = document.querySelector(`[data-plate="${h.key}"]`);
    if (!plate) return;
    plate.innerHTML = `<input
      class="score-input"
      type="number"
      inputmode="numeric"
      min="0"
      max="${CONFIG.MAX_SCORE}"
      step="1"
      data-input="${h.key}"
      value="${state[h.key]}"
      aria-label="${h.name} points"
    />`;
  });
}

function updateVisual(house, value, syncInput=true){
  const n = Number.isFinite(Number(value)) ? Math.trunc(Number(value)) : 0;
  state[house] = clamp(n, 0, CONFIG.MAX_SCORE);

  const slot = document.querySelector(`.slot[data-house="${house}"]`);
  const vial = slot?.querySelector('.vial');
  const input = document.querySelector(`[data-input="${house}"]`);

  if (vial) vial.style.setProperty('--fill', pct(state[house]) + '%');
  if (syncInput && input && document.activeElement !== input) input.value = state[house];
}

function inputState(house, className){
  const input = document.querySelector(`[data-input="${house}"]`);
  if (!input) return;
  input.classList.remove('saving','saved','save-error');
  if (className) input.classList.add(className);
}

async function dataApi(path, options={}){
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
      'Content-Type':'application/json',
      ...(options.headers || {})
    }
  });

  const text = await res.text();
  if (!res.ok) {
    let message = text;
    try {
      const j = JSON.parse(text);
      message = j.message || j.hint || j.details || text;
    } catch(e){}
    throw new Error(message || `HTTP ${res.status}`);
  }
  return text ? JSON.parse(text) : null;
}

async function readRemote(){
  const rows = await dataApi(
    `house_points?board_id=eq.${encodeURIComponent(CONFIG.BOARD_ID)}&select=house,points`
  );

  if (Array.isArray(rows)) {
    rows.forEach(r => {
      if (state[r.house] !== undefined) updateVisual(r.house, r.points);
    });
  }
}

async function writeRemote(house, points){
  await dataApi(
    `house_points?board_id=eq.${encodeURIComponent(CONFIG.BOARD_ID)}&house=eq.${encodeURIComponent(house)}`,
    {
      method:'PATCH',
      headers:{ Prefer:'return=minimal' },
      // RLS/grants allow public users to change only this column.
      body:JSON.stringify({ points:Math.trunc(points) })
    }
  );
}

async function commit(house, rawValue){
  const input = document.querySelector(`[data-input="${house}"]`);
  let points = Math.trunc(Number(rawValue));
  if (!Number.isFinite(points)) points = state[house];
  points = clamp(points, 0, CONFIG.MAX_SCORE);

  const old = state[house];
  updateVisual(house, points, false);
  if (input) input.value = points;
  inputState(house, 'saving');

  try {
    await writeRemote(house, points);
    inputState(house, 'saved');
    clearTimeout(saveTimers.get(house));
    saveTimers.set(house, setTimeout(() => inputState(house, ''), 650));
  } catch(err) {
    updateVisual(house, old);
    if (input) input.value = old;
    inputState(house, 'save-error');
    clearTimeout(saveTimers.get(house));
    saveTimers.set(house, setTimeout(() => inputState(house, ''), 1400));
    console.error(`Could not save ${house}:`, err);
  }
}

function bindInputs(){
  document.addEventListener('change', e => {
    if (e.target.matches('input[data-input]')) {
      commit(e.target.dataset.input, e.target.value);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input[data-input]')) {
      e.preventDefault();
      e.target.blur();
    }
  });
}

async function init(){
  mountPlates();
  bindInputs();
  HOUSES.forEach(h => updateVisual(h.key, state[h.key]));

  try {
    await readRemote();
  } catch(err) {
    console.error('Supabase read failed:', err);
  }

  setInterval(() => readRemote().catch(err => console.error('Supabase poll failed:', err)), CONFIG.POLL_MS);
}

init();
</script>

</body>
</html>
